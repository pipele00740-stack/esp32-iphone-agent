name: Build Cardputer Bin
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Platform and Libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.7
          arduino-cli lib install "NimBLE-Arduino@2.5.1"

      - name: Strip Static Asserts from Ble Link
        run: |
          # مسح الأسطر ديال static_assert المزعجة نهائياً من الملف
          sed -i '/static_assert/d' hardware/hid_bridge/ble_link.cpp

      - name: Compile Firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc \
            --output-dir ./out \
            hardware/hid_bridge

      - name: Upload Bin
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-agent-bin
          path: ./out/*.bin
